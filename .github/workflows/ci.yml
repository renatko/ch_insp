name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: go test -count=1 ./...
      - name: Test package manager manifests
        run: python3 -m unittest discover -s tests/release -p 'test_*.py'

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: chinspector-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start demo
        run: docker compose -f demo/compose.yaml up -d --wait --wait-timeout 300
      - name: Check demo data and logs
        run: ./demo/scripts/check.sh
      - name: Run ClickHouse local query tests
        run: |
          mkdir -p "$RUNNER_TEMP/chinspector-bin"
          cat > "$RUNNER_TEMP/chinspector-bin/clickhouse" <<'EOF'
          #!/bin/sh
          exec docker compose -f "$GITHUB_WORKSPACE/demo/compose.yaml" exec -T -e TZ=UTC standalone clickhouse "$@"
          EOF
          chmod +x "$RUNNER_TEMP/chinspector-bin/clickhouse"
          PATH="$RUNNER_TEMP/chinspector-bin:$PATH" go test -count=1 -run '^(TestHistoryQueriesWithClickHouseLocal|TestHistoryQueryDistinguishesZeroFromNoEvent|TestRateQueriesExcludeFutureAndOldEvents|TestViewStatusQueryWithClickHouseLocal|TestViewExecutionsQueryWithClickHouseLocal|TestFlowDiagnosticsQueriesWithClickHouseLocal)$' ./internal/clickhouse
      - name: Build demo TUI
        run: docker compose -f demo/compose.yaml --profile tui build tui
      - name: Open demo TUI
        run: python3 tests/demo/tui_smoke.py
      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f demo/compose.yaml logs --no-color --tail 200
      - name: Stop demo
        if: always()
        run: docker compose -f demo/compose.yaml down --remove-orphans

  release-build:
    name: Release builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install package tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          sudo apt-get update && sudo apt-get install -y rpm cpio
      - name: Build release archives
        run: python3 scripts/build_release.py "$RUNNER_TEMP/chinspector-release"
      - name: Verify archives and checksums
        run: python3 tests/release/check_archives.py "$RUNNER_TEMP/chinspector-release"
      - name: Install and run Debian package
        run: |
          sudo dpkg -i "$RUNNER_TEMP/chinspector-release/ch_insp_0.0.0_amd64.deb"
          ch_insp --help
          sudo dpkg -r ch-insp
