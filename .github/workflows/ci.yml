name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: go test -count=1 ./...

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: chinspector-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start demo
        run: docker compose -f demo/compose.yaml up -d --wait --wait-timeout 300
      - name: Check demo data and logs
        run: ./demo/scripts/check.sh
      - name: Run ClickHouse local query tests
        run: |
          mkdir -p "$RUNNER_TEMP/chinspector-bin"
          cat > "$RUNNER_TEMP/chinspector-bin/clickhouse" <<'EOF'
          #!/bin/sh
          exec docker compose -f "$GITHUB_WORKSPACE/demo/compose.yaml" exec -T -e TZ=UTC standalone clickhouse "$@"
          EOF
          chmod +x "$RUNNER_TEMP/chinspector-bin/clickhouse"
          PATH="$RUNNER_TEMP/chinspector-bin:$PATH" go test -count=1 -run '^(TestHistoryQueriesWithClickHouseLocal|TestHistoryQueryDistinguishesZeroFromNoEvent|TestRateQueriesExcludeFutureAndOldEvents|TestViewStatusQueryWithClickHouseLocal)$' ./internal/clickhouse
      - name: Build demo TUI
        run: docker compose -f demo/compose.yaml --profile tui build tui
      - name: Open demo TUI
        run: python3 tests/demo/tui_smoke.py
      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f demo/compose.yaml logs --no-color --tail 200
      - name: Stop demo
        if: always()
        run: docker compose -f demo/compose.yaml down --remove-orphans
