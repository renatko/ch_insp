name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release archives
        run: python3 scripts/build_release.py "$RUNNER_TEMP/chinspector-release"
      - name: Verify archives and checksums
        run: python3 tests/release/check_archives.py "$RUNNER_TEMP/chinspector-release"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/chinspector-release/"*
